<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="style.css">
    <title>Kvíz</title>
</head>
<body>
    <div id="darkMode">
        <p>Dark Mode</p>
        <input type="checkbox" id="darkModeButton" onclick="DarkMode()">
    </div>
    <main class="kontener">
        <h1>Hány pontot érsz el?</h1>
        <section class="informacio-sor">
            <p>Pontszám: <span id="pontszam">0</span></p>
            <p>Kérdés: <span id="kerdes-szam">0</span></p>
        </section>
        <section class="kezdo-kepernyo">
            <h2 id="valaszt">Válassz kategóriát!</h2>
            <div class="gombok">
                <div id="tizrnot">
                    <p>15 kérdést tartalmazó kvízek:</p>
                    <button onclick="kvizInditas('iskola')" class="kviz-valasztas">
                        A Mechwart történelme 
                    </button>   
                </div>
                <div id="tiz">
                    <p>10 kérdést tartalmazó kvízek:</p>
                    <button onclick="kvizInditas('tablok')" class="kviz-valasztas">
                        A Mechwart tablói 
                    </button>
                    <button onclick="kvizInditas('matek10')" class="kviz-valasztas">
                        Matematika 
                    </button>
                </div>
                <div id="ot">                    
                    <p>5 kérdést tartalmazó kvízek:</p>
                    <button onclick="kvizInditas('matek')" class="kviz-valasztas">
                        Matematika 
                    </button>
                </div>    
            </div>
        </section>
        <section class="kviz-doboz rejtett">
            <h2 id="kerdes">Betöltés...</h2>
            <div class="valaszok" id="valaszok">
            </div>
            <button id="kovetkezo-gomb">Következő kérdés</button>
        </section>
        <section class="eredmeny rejtett" id="eredmeny">
            <h2>Vége a játéknak!</h2>
            <br>
            <p>Elért pontszám: <span id="vegso-pontszam"></span></p>
            <br>
            <button onclick="ujrainditas()" id="ujra">Újraindítás</button>
            <br>
            <button onclick="vissza()" id="vissza">Vissza a kvízekhez</button>
        </section>
    </main>
    <script src="main.js"></script>
</body>
</html>
